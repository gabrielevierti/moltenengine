<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Molten Engine: A native game engine for Apple silicon, built on Metal. Games in C++ or visual scripts, made in a full editor."><title>Molten Engine: A native game engine for Apple silicon, built on Metal. Games in C++ or visual scripts, made in a full editor.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#ff8a3d;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#484f58;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes flow{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}</style><rect x=".5" y=".5" width="959" height="259" rx="14" fill="#161b22" stroke="#30363d"/><text x="48" y="64" class="sans" font-size="12" font-weight="600" letter-spacing="1.3" fill="#8b949e">GAME ENGINE · APPLE SILICON · METAL</text><text x="46" y="122" class="sans" font-size="52" font-weight="700" letter-spacing="-1.3" fill="#e6edf3">Molten Engine</text><text x="48" y="160" class="sans" font-size="18.5" fill="#8b949e">A native game engine for Apple silicon, built on Metal.</text><text x="48" y="185" class="sans" font-size="18.5" fill="#8b949e">Games in C++ or visual scripts, made in a full editor.</text><rect x="48" y="214" width="64" height="24" rx="12" fill="none" stroke="#ff8a3d"/><text x="80" y="230" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#ff8a3d">GPL-3.0</text><rect x="120.19999999999999" y="214" width="38" height="24" rx="12" fill="none" stroke="#30363d"/><text x="139" y="230" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#8b949e">C++</text><rect x="166.0" y="214" width="51" height="24" rx="12" fill="none" stroke="#30363d"/><text x="192" y="230" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#8b949e">Metal</text><rect x="225.0" y="214" width="150" height="24" rx="12" fill="none" stroke="#30363d"/><text x="300" y="230" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#8b949e">macOS · iOS · iPadOS</text><rect x="383.0" y="214" width="176" height="24" rx="12" fill="none" stroke="#30363d"/><text x="471" y="230" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#8b949e">v1.0 · early development</text><g transform="translate(800 130) scale(1.35)"><defs><linearGradient id="mg" x1="-92" y1="0" x2="92" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8b949e"/><stop offset=".42" stop-color="#e6edf3"/><stop offset=".6" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient></defs><ellipse cy="64" rx="70" ry="5" class="dimline" opacity=".5"/><path d="M-92 50C-72 44-62-28-42-28C-22-28-16 18 0 18C16 18 24-22 44-22C64-22 74 42 92 50" fill="none" stroke="#ff8a3d" stroke-width="2" stroke-linecap="round" opacity=".45"/><path d="M-92 38C-74 30-66-44-42-44C-20-44-16 4 0 4C16 4 22-38 44-38C66-38 74 30 92 38" fill="none" stroke="url(#mg)" stroke-width="9" stroke-linecap="round"/><path d="M-92 38C-74 30-66-44-42-44C-20-44-16 4 0 4C16 4 22-38 44-38C66-38 74 30 92 38" fill="none" stroke="#161b22" stroke-width="2.4" stroke-linecap="round" opacity=".55"/><path d="M-92 38C-74 30-66-44-42-44C-20-44-16 4 0 4C16 4 22-38 44-38C66-38 74 30 92 38" fill="none" stroke="#d29922" stroke-width="3" stroke-linecap="round" pathLength="1" stroke-dasharray=".1 .9" style="animation:flow 3.2s linear infinite"/></g></svg>
