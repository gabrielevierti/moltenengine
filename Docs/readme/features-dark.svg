<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 406" width="960" height="406" role="img" aria-label="Features: A complete visual editor: Dockable Scene, Game, Hierarchy, Inspector, Explorer and Console panels; gizmos, snapping, Play and Stop.; C++ or visual scripting: Components are plain C++ structs rebuilt on save, or about 40 visual nodes with no code at all.; Ray tracing on Apple GPUs: Hardware ray-traced shadows, AO, reflections and lighting, on top of PBR, HDR and cascaded shadows.; Physics down to the parts: Rigid bodies, joints and mesh colliders; vehicles built from wheels, suspension, engines and wings.; Mac, iPhone and iPad: Build and install on a device from the editor's Build window, with touch controls and screen presets.; Only Apple silicon: Tile-based rendering, memoryless targets and unified memory. No Windows, no Linux, no layers."><title>Features: A complete visual editor: Dockable Scene, Game, Hierarchy, Inspector, Explorer and Console panels; gizmos, snapping, Play and Stop.; C++ or visual scripting: Components are plain C++ structs rebuilt on save, or about 40 visual nodes with no code at all.; Ray tracing on Apple GPUs: Hardware ray-traced shadows, AO, reflections and lighting, on top of PBR, HDR and cascaded shadows.; Physics down to the parts: Rigid bodies, joints and mesh colliders; vehicles built from wheels, suspension, engines and wings.; Mac, iPhone and iPad: Build and install on a device from the editor's Build window, with touch controls and screen presets.; Only Apple silicon: Tile-based rendering, memoryless targets and unified memory. No Windows, no Linux, no layers.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#ff8a3d;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#484f58;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes hl{0%{opacity:0}5.00%,13.33%{opacity:1}19.17%,100%{opacity:0}}.hl{opacity:0;animation:hl 9.60s ease-in-out infinite}</style><g><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="#161b22" stroke="#30363d"/><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#ff8a3d" stroke-opacity=".5" class="hl" style="animation-delay:0.00s"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="#ff8a3d" fill-opacity=".12" class="hl" style="animation-delay:0.00s"/><g transform="translate(32.0 32)"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0M14 4v4M8 10v4M16 16v4" fill="none" stroke="#ff8a3d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">A complete visual editor</text><text x="84.0" y="66" class="sans" font-size="13.5" fill="#8b949e">Dockable Scene, Game, Hierarchy, Inspector,</text><text x="84.0" y="85" class="sans" font-size="13.5" fill="#8b949e">Explorer and Console panels; gizmos, snapping,</text><text x="84.0" y="104" class="sans" font-size="13.5" fill="#8b949e">Play and Stop.</text></g><g><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="#161b22" stroke="#30363d"/><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#ff8a3d" stroke-opacity=".5" class="hl" style="animation-delay:1.60s"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="#ff8a3d" fill-opacity=".12" class="hl" style="animation-delay:1.60s"/><g transform="translate(520.0 32)"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" fill="none" stroke="#ff8a3d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">C++ or visual scripting</text><text x="572.0" y="66" class="sans" font-size="13.5" fill="#8b949e">Components are plain C++ structs rebuilt on save,</text><text x="572.0" y="85" class="sans" font-size="13.5" fill="#8b949e">or about 40 visual nodes with no code at all.</text></g><g><rect x="0.5" y="147.5" width="471.0" height="111" rx="12" fill="#161b22" stroke="#30363d"/><rect x="0.5" y="147.5" width="471.0" height="111" rx="12" fill="none" stroke="#ff8a3d" stroke-opacity=".5" class="hl" style="animation-delay:3.20s"/><rect x="24.0" y="171" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="24.0" y="171" width="40" height="40" rx="10" fill="#ff8a3d" fill-opacity=".12" class="hl" style="animation-delay:3.20s"/><g transform="translate(32.0 179)"><path d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" fill="none" stroke="#ff8a3d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="189" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">Ray tracing on Apple GPUs</text><text x="84.0" y="213" class="sans" font-size="13.5" fill="#8b949e">Hardware ray-traced shadows, AO, reflections and</text><text x="84.0" y="232" class="sans" font-size="13.5" fill="#8b949e">lighting, on top of PBR, HDR and cascaded shadows.</text></g><g><rect x="488.5" y="147.5" width="471.0" height="111" rx="12" fill="#161b22" stroke="#30363d"/><rect x="488.5" y="147.5" width="471.0" height="111" rx="12" fill="none" stroke="#ff8a3d" stroke-opacity=".5" class="hl" style="animation-delay:4.80s"/><rect x="512.0" y="171" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="512.0" y="171" width="40" height="40" rx="10" fill="#ff8a3d" fill-opacity=".12" class="hl" style="animation-delay:4.80s"/><g transform="translate(520.0 179)"><path d="M4 8l8-4 8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8" fill="none" stroke="#ff8a3d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="189" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">Physics down to the parts</text><text x="572.0" y="213" class="sans" font-size="13.5" fill="#8b949e">Rigid bodies, joints and mesh colliders; vehicles</text><text x="572.0" y="232" class="sans" font-size="13.5" fill="#8b949e">built from wheels, suspension, engines and wings.</text></g><g><rect x="0.5" y="275.5" width="471.0" height="130" rx="12" fill="#161b22" stroke="#30363d"/><rect x="0.5" y="275.5" width="471.0" height="130" rx="12" fill="none" stroke="#ff8a3d" stroke-opacity=".5" class="hl" style="animation-delay:6.40s"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="#ff8a3d" fill-opacity=".12" class="hl" style="animation-delay:6.40s"/><g transform="translate(32.0 307)"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2" fill="none" stroke="#ff8a3d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">Mac, iPhone and iPad</text><text x="84.0" y="341" class="sans" font-size="13.5" fill="#8b949e">Build and install on a device from the editor's</text><text x="84.0" y="360" class="sans" font-size="13.5" fill="#8b949e">Build window, with touch controls and screen</text><text x="84.0" y="379" class="sans" font-size="13.5" fill="#8b949e">presets.</text></g><g><rect x="488.5" y="275.5" width="471.0" height="130" rx="12" fill="#161b22" stroke="#30363d"/><rect x="488.5" y="275.5" width="471.0" height="130" rx="12" fill="none" stroke="#ff8a3d" stroke-opacity=".5" class="hl" style="animation-delay:8.00s"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#30363d"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="#ff8a3d" fill-opacity=".12" class="hl" style="animation-delay:8.00s"/><g transform="translate(520.0 307)"><path d="M7 7h10v10H7zM10 10h4v4h-4zM10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4" fill="none" stroke="#ff8a3d" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#e6edf3">Only Apple silicon</text><text x="572.0" y="341" class="sans" font-size="13.5" fill="#8b949e">Tile-based rendering, memoryless targets and</text><text x="572.0" y="360" class="sans" font-size="13.5" fill="#8b949e">unified memory. No Windows, no Linux, no layers.</text></g></svg>
